<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>thin-scrollbars-everywhere example</title>
    <style>
    body {
      font-family: sans-serif;
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      padding: 16px;
    }
    .box {
      overflow: auto;
      border: 1px solid #888;
      padding: 8px;
    }
    .filler {
      width: 150%;
      height: 400px;
      background: linear-gradient(135deg, #cde, #edc);
    }
    </style>
    <script type="module">
    import { applyThinScrollbarsEverywhere } from "../mod.ts";

    applyThinScrollbarsEverywhere();

    // Open and closed shadow roots created after the call.
    for (const mode of ["open", "closed"]) {
      const host = document.createElement("div");
      host.className = "box";
      host.style.width = "220px";
      host.style.height = "160px";
      const root = host.attachShadow({ mode });
      root.innerHTML = `
        <p>${mode} shadow root</p>
        <div style="overflow: auto; width: 180px; height: 90px;
          border: 1px solid #888;">
          <div style="width: 400px; height: 300px;
            background: linear-gradient(135deg, #dce8ff, #ffe8dc);"></div>
        </div>
      `;
      document.body.append(host);
    }

    // A shadow root attached one second later, to show the observer.
    setTimeout(() => {
      const host = document.createElement("div");
      host.className = "box";
      host.style.width = "220px";
      host.style.height = "160px";
      const root = host.attachShadow({ mode: "open" });
      root.innerHTML = `
        <p>late shadow root</p>
        <div style="overflow: auto; height: 90px;">
          <div style="height: 300px; background: #dfd;"></div>
        </div>
      `;
      document.body.append(host);
    }, 1000);
    </script>
  </head>
  <body>
    <div class="box" style="width: 300px; height: 200px">
      <p>Plain scrollable div</p>
      <div class="filler"></div>
    </div>
    <div class="box" style="width: 160px; height: 320px; background: #fdc">
      <p>Tall narrow div (colored background)</p>
      <div class="filler"></div>
    </div>
    <div class="box" style="width: 400px; height: 120px">
      <p>Short wide div</p>
      <div class="filler"></div>
    </div>
    <div class="box" style="width: 240px; height: 180px">
      <p>Declarative shadow root</p>
      <div>
        <template shadowrootmode="open">
          <div
            style="overflow: auto; height: 90px; border: 1px solid #888;
              background: #ddf"
          >
            <div style="height: 300px"></div>
          </div>
        </template>
      </div>
    </div>
    <div style="width: 100%">
      <p>Body-level content, long enough to make the page itself scroll.</p>
      <div class="filler" style="width: 120vw; height: 150vh"></div>
    </div>
  </body>
</html>
